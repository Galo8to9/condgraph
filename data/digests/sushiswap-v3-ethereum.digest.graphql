# Condensed subgraph schema.
# Filters and ordering follow standard subgraph conventions and are omitted here:
#   where: { <field>: value, <field>_gt: value, <field>_lt: value,
#            <field>_gte: value, <field>_lte: value, <field>_in: [values],
#            <field>_not: value, <field>_contains: substring, ... }
#   orderBy: <any field on the entity>
#   orderDirection: asc | desc
#   first: <n>   skip: <n>   block: { number: <n> }
# Apply these to any list query on the entities below.


scalar BigDecimal
scalar BigInt
scalar Bytes

enum Aggregation_interval {
  hour
  day
}

enum LiquidityPoolFeeType {
  FIXED_TRADING_FEE
  TIERED_TRADING_FEE
  DYNAMIC_TRADING_FEE
  FIXED_LP_FEE
  DYNAMIC_LP_FEE
  FIXED_PROTOCOL_FEE
  DYNAMIC_PROTOCOL_FEE
  DEPOSIT_FEE
  WITHDRAWAL_FEE
}

enum Network {
  ARBITRUM_ONE
  ARWEAVE_MAINNET
  AURORA
  AVALANCHE
  BOBA
  BSC
  CELO
  COSMOS
  CRONOS
  MAINNET
  FANTOM
  FUSE
  HARMONY
  JUNO
  MOONBEAM
  MOONRIVER
  NEAR_MAINNET
  OPTIMISM
  OSMOSIS
  MATIC
  XDAI
}

enum ProtocolType {
  EXCHANGE
  LENDING
  YIELD
  BRIDGE
  GENERIC
}

enum RewardTokenType {
  DEPOSIT
  BORROW
}

enum TokenType {
  MULTIPLE
  UNKNOWN
  ERC20
  ERC721
  ERC1155
  BEP20
  BEP721
  BEP1155
}

"  Used to keep track of the price of Ether/TVL in USD, pool deposit count, and total unique users "
type _HelperStore {
  id: Bytes!
  " Token Prices "
  valueDecimalList: [BigDecimal!]
  " price of ETH/TVL in USD "
  valueDecimal: BigDecimal
  " # of deposits, # of unique users "
  valueInt: Int
}

type _LiquidityPoolAmount {
  " Smart contract address of the pool "
  id: Bytes!
  " Input tokens of the pool (not input tokens of the event/transaction). E.g. WETH and USDC from a WETH-USDC pool "
  inputTokens: [Token!]!
  " Amount of input tokens in the pool. The ordering should be the same as the pool's `inputTokens` field. "
  inputTokenBalances: [BigDecimal!]!
  tokenPrices: [BigDecimal!]!
}

" This is used to keep tract of the derived price of tokens in ethereum and the whitelisted pools to which it belongs"
type _TokenWhitelist {
  " Token Address "
  id: Bytes!
  " pools token is in that are white listed for USD pricing "
  whitelistPools: [LiquidityPool!]!
}

type _TokenWhitelistSymbol {
  " Whitelist Token Symbol "
  id: ID!
  " Whitelist Token Address"
  address: Bytes!
}

type Account {
  " { Account address } "
  id: Bytes!
  " Number of positions this account has "
  positionCount: Int!
  " All positions that belong to this account "
  positions: [Position!]!
  " Number of open positions this account has "
  openPositionCount: Int!
  " Number of closed positions this account has "
  closedPositionCount: Int!
  " Number of deposits this account made "
  depositCount: Int!
  " All deposit events of this account "
  deposits: [Deposit!]!
  " Number of withdrawals this account made "
  withdrawCount: Int!
  " All withdraw events of this account "
  withdraws: [Withdraw!]!
  " Number of times this account has traded/swapped"
  swapCount: Int!
  " All swap events of this account "
  swaps: [Swap!]!
}

type ActiveAccount {
  " { daily/hourly }-{ Address of the account }-{ Days/hours since Unix epoch } "
  id: Bytes!
}

"An event is any user action that occurs in a protocol. Generally, they are Ethereum events
emitted by a function in the smart contracts, stored in transaction receipts as event logs.
However, some user actions of interest are function calls that don't emit events. For example,
the deposit and withdraw functions in Yearn do not emit any events. In our subgraphs, we still
store them as events, although they are not technically Ethereum events emitted by smart
contracts."
type Deposit {
  " { Transaction hash }-{ Log index } "
  id: Bytes!
  " Transaction hash of the transaction that emitted this event "
  hash: Bytes!
  " Nonce of the transaction that emitted this event "
  nonce: BigInt!
  " Event log index. For transactions that don't emit event, create arbitrary index starting from 0 "
  logIndex: Int!
  " Gas limit of the transaction that emitted this event "
  gasLimit: BigInt
  " Gas used in this transaction. (Optional because not every chain will support this) "
  gasUsed: BigInt
  " Gas price of the transaction that emitted this event "
  gasPrice: BigInt
  " The protocol this transaction belongs to "
  protocol: DexAmmProtocol!
  " Account that emitted this event "
  account: Account!
  " The user position changed by this event "
  position: Position
  " The pool involving this event "
  pool: LiquidityPool!
  " lower tick of position "
  tickLower: BigInt
  " upper tick of position "
  tickUpper: BigInt
  " Block number of this event "
  blockNumber: BigInt!
  " Timestamp of this event "
  timestamp: BigInt!
  " Amount of liquidity minted "
  liquidity: BigInt!
  " Input tokens of the pool. E.g. WETH and USDC to a WETH-USDC pool "
  inputTokens: [Token!]!
  " Amount of input tokens in the token's native unit "
  inputTokenAmounts: [BigInt!]!
  " Amount of input tokens in the liquidity pool "
  reserveAmounts: [BigInt!]
  " USD-normalized value of the transaction of the underlying (e.g. sum of tokens deposited into a pool) "
  amountUSD: BigDecimal!
}

type DexAmmProtocol {
  " Smart contract address of the protocol's main contract (Factory, Registry, etc) "
  id: Bytes!
  " Name of the protocol, including version. e.g. Uniswap v3 "
  name: String!
  " Slug of protocol, including version. e.g. uniswap-v3 "
  slug: String!
  " Version of the subgraph schema, in SemVer format (e.g. 1.0.0) "
  schemaVersion: String!
  " Version of the subgraph implementation, in SemVer format (e.g. 1.0.0) "
  subgraphVersion: String!
  " Version of the methodology used to compute metrics, loosely based on SemVer format (e.g. 1.0.0) "
  methodologyVersion: String!
  " The blockchain network this subgraph is indexing on "
  network: Network!
  " The type of protocol (e.g. DEX, Lending, Yield, etc) "
  type: ProtocolType!
  " Current TVL (Total Value Locked) of the entire protocol "
  totalValueLockedUSD: BigDecimal!
  " The sum of all active and non-active liquidity in USD for this pool. "
  totalLiquidityUSD: BigDecimal!
  " All liquidity in USD that is active. Will be equal to totalLiquidity except for in concentrated liquidity - where activeLiquidity is all liquidity positions that contain the pools current tick. "
  activeLiquidityUSD: BigDecimal!
  " All protocol-side value locking in USD that remains uncollected and unused in the protocol. "
  uncollectedProtocolSideValueUSD: BigDecimal!
  " All supply-side value locking in USD that remains uncollected and unused in the protocol. "
  uncollectedSupplySideValueUSD: BigDecimal!
  " Current PCV (Protocol Controlled Value). Only relevant for protocols with PCV. "
  protocolControlledValueUSD: BigDecimal
  " All historical volume in USD "
  cumulativeVolumeUSD: BigDecimal!
  " Revenue claimed by suppliers to the protocol. LPs on DEXs (e.g. 0.25% of the swap fee in Sushiswap). Depositors on Lending Protocols. NFT sellers on OpenSea. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " Gross revenue for the protocol (revenue claimed by protocol). Examples: AMM protocol fee (Sushi’s 0.05%). OpenSea 10% sell fee. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the protocol. e.g. 0.30% of swap fee in Sushiswap, all yield generated by Yearn. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Number of cumulative unique users "
  cumulativeUniqueUsers: Int!
  " Number of cumulative liquidity providers "
  cumulativeUniqueLPs: Int!
  " Number of cumulative traders "
  cumulativeUniqueTraders: Int!
  " Total number of pools "
  totalPoolCount: Int!
  " Total number of open positions "
  openPositionCount: Int!
  " Total number of positions (open and closed) "
  cumulativePositionCount: Int!
  " Day ID of the most recent daily snapshot "
  lastSnapshotDayID: Int!
  " Timestamp of the last time this entity was updated "
  lastUpdateTimestamp: BigInt!
  " Block number of the last time this entity was updated "
  lastUpdateBlockNumber: BigInt!
  " Daily usage metrics for this protocol "
  dailyUsageMetrics: [UsageMetricsDailySnapshot!]!
  " Hourly usage metrics for this protocol "
  hourlyUsageMetrics: [UsageMetricsHourlySnapshot!]!
  " Daily financial metrics for this protocol "
  financialMetrics: [FinancialsDailySnapshot!]!
  " All pools that belong to this protocol "
  pools: [LiquidityPool!]!
  " This is a boolean to indicate whether or not the pools have been instantiated the were initialized before Optimism regenesis "
  _regenesis: Boolean!
}

