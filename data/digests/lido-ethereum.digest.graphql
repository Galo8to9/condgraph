# Condensed subgraph schema.
# Filters and ordering follow standard subgraph conventions and are omitted here:
#   where: { <field>: value, <field>_gt: value, <field>_lt: value,
#            <field>_gte: value, <field>_lte: value, <field>_in: [values],
#            <field>_not: value, <field>_contains: substring, ... }
#   orderBy: <any field on the entity>
#   orderDirection: asc | desc
#   first: <n>   skip: <n>   block: { number: <n> }
# Apply these to any list query on the entities below.


scalar BigDecimal
scalar BigInt

enum Aggregation_interval {
  hour
  day
}

enum Network {
  ARBITRUM_ONE
  ARWEAVE_MAINNET
  AURORA
  AVALANCHE
  BOBA
  BSC
  CELO
  COSMOS
  CRONOS
  MAINNET
  FANTOM
  FUSE
  HARMONY
  JUNO
  MOONBEAM
  MOONRIVER
  NEAR_MAINNET
  OPTIMISM
  OSMOSIS
  MATIC
  XDAI
}

enum ProtocolType {
  EXCHANGE
  LENDING
  YIELD
  BRIDGE
  GENERIC
}

enum RewardTokenType {
  DEPOSIT
  BORROW
}

type Account {
  " Address of the account "
  id: ID!
}

type ActiveAccount {
  " { daily/hourly }-{ Address of the account }-{ Days/hours since Unix epoch } "
  id: ID!
}

type FinancialsDailySnapshot {
  " ID is # of days since Unix epoch time "
  id: ID!
  " Protocol this snapshot is associated with "
  protocol: Protocol!
  " Current TVL (Total Value Locked) of the entire protocol "
  totalValueLockedUSD: BigDecimal!
  " Current PCV (Protocol Controlled Value). Only relevant for protocols with PCV. "
  protocolControlledValueUSD: BigDecimal
  " Revenue claimed by suppliers to the protocol. LPs on DEXs (e.g. 0.25% of the swap fee in Sushiswap). Depositors on Lending Protocols. NFT sellers on OpenSea. "
  dailySupplySideRevenueUSD: BigDecimal!
  " Revenue claimed by suppliers to the protocol. LPs on DEXs (e.g. 0.25% of the swap fee in Sushiswap). Depositors on Lending Protocols. NFT sellers on OpenSea. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " Gross revenue for the protocol (revenue claimed by protocol). Examples: AMM protocol fee (Sushi’s 0.05%). OpenSea 10% sell fee. "
  dailyProtocolSideRevenueUSD: BigDecimal!
  " Gross revenue for the protocol (revenue claimed by protocol). Examples: AMM protocol fee (Sushi’s 0.05%). OpenSea 10% sell fee. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the protocol. e.g. 0.30% of swap fee in Sushiswap, all yield generated by Yearn. "
  dailyTotalRevenueUSD: BigDecimal!
  " All revenue generated by the protocol. e.g. 0.30% of swap fee in Sushiswap, all yield generated by Yearn. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Block number of this snapshot "
  blockNumber: BigInt!
  " Timestamp of this snapshot "
  timestamp: BigInt!
}

type Pool {
  " Smart contract address of the pool "
  id: ID!
  " The protocol this pool belongs to "
  protocol: Protocol!
  " Name of the pool (e.g. Curve.fi DAI/USDC/USDT) "
  name: String
  " Symbol of liquidity pool (e.g. 3CRV) "
  symbol: String
  " Tokens that need to be deposited to take a position in protocol. e.g. WETH and USDC to deposit into the WETH-USDC pool. Array to account for multi-asset pools like Curve and Balancer "
  inputTokens: [Token!]!
  " Token that is minted to track ownership of position in protocol "
  outputToken: Token
  " Aditional tokens that are given as reward for position in a protocol, usually in liquidity mining programs. e.g. SUSHI in the Onsen program, MATIC for Aave Polygon, usually in liquidity mining programs. e.g. SUSHI in the Onsen program, MATIC for Aave Polygon "
  rewardTokens: [RewardToken!]
  " Creation timestamp "
  createdTimestamp: BigInt!
  " Creation block number "
  createdBlockNumber: BigInt!
  " Current TVL (Total Value Locked) of this pool in USD "
  totalValueLockedUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the supply side. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the protocol. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the pool. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Amount of input tokens in the pool. The ordering should be the same as the pool's `inputTokens` field. "
  inputTokenBalances: [BigInt!]!
  " The USD value of input tokens in this pool. Should be the same order as the pool's `inputTokens` field. "
  inputTokenBalancesUSD: [BigDecimal!]!
  " Total supply of output token. Note that certain DEXes don't have an output token (e.g. Bancor) "
  outputTokenSupply: BigInt
  " Price per share of output token in USD "
  outputTokenPriceUSD: BigDecimal
  " Total supply of output tokens that are staked (usually in the MasterChef contract). Used to calculate reward APY. "
  stakedOutputTokenAmount: BigInt
  " Per-block reward token emission as of the current block normalized to a day, in token's native amount. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsAmount: [BigInt!]
  " Per-block reward token emission as of the current block normalized to a day, in USD value. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsUSD: [BigDecimal!]
  " Pool daily snapshots "
  dailySnapshots: [PoolDailySnapshot!]!
  " Pool hourly snapshots "
  hourlySnapshots: [PoolHourlySnapshot!]!
}

type PoolDailySnapshot {
  " { Smart contract address of the pool }-{ # of days since Unix epoch time } "
  id: ID!
  " The protocol this snapshot belongs to "
  protocol: Protocol!
  " The pool this snapshot belongs to "
  pool: Pool!
  " Block number of this snapshot "
  blockNumber: BigInt!
  " Timestamp of this snapshot "
  timestamp: BigInt!
  " Current TVL (Total Value Locked) of this pool "
  totalValueLockedUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the supply side. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " Daily revenue generated by the pool, accrued to the supply side. "
  dailySupplySideRevenueUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the protocol. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " Daily revenue generated by the pool, accrued to the protocol. "
  dailyProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the pool. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Daily revenue generated by the pool. "
  dailyTotalRevenueUSD: BigDecimal!
  " Amount of input tokens in the pool. The ordering should be the same as the pool's `inputTokens` field. "
  inputTokenBalances: [BigInt!]!
  " The USD value of input tokens in this pool. Should be the same order as the pool's `inputTokens` field. "
  inputTokenBalancesUSD: [BigDecimal!]!
  " Total supply of output token. Note that certain DEXes don't have an output token (e.g. Bancor) "
  outputTokenSupply: BigInt
  " Price per share of output token in USD "
  outputTokenPriceUSD: BigDecimal
  " Total supply of output tokens that are staked (usually in the MasterChef contract). Used to calculate reward APY. "
  stakedOutputTokenAmount: BigInt
  " Per-block reward token emission as of the current block normalized to a day, in token's native amount. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsAmount: [BigInt!]
  " Per-block reward token emission as of the current block normalized to a day, in USD value. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsUSD: [BigDecimal!]
}

type PoolHourlySnapshot {
  " { Smart contract address of the pool }-{ # of hours since Unix epoch time } "
  id: ID!
  " The protocol this snapshot belongs to "
  protocol: Protocol!
  " The pool this snapshot belongs to "
  pool: Pool!
  " Block number of this snapshot "
  blockNumber: BigInt!
  " Timestamp of this snapshot "
  timestamp: BigInt!
  " Current TVL (Total Value Locked) of this pool "
  totalValueLockedUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the supply side. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " Hourly revenue generated by the pool, accrued to the supply side. "
  hourlySupplySideRevenueUSD: BigDecimal!
  " All revenue generated by the pool, accrued to the protocol. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " Hourly revenue generated by the pool, accrued to the protocol. "
  hourlyProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the pool. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Hourly revenue generated by the pool. "
  hourlyTotalRevenueUSD: BigDecimal!
  " Amount of input tokens in the pool. The ordering should be the same as the pool's `inputTokens` field. "
  inputTokenBalances: [BigInt!]!
  " The USD value of input tokens in this pool. Should be the same order as the pool's `inputTokens` field. "
  inputTokenBalancesUSD: [BigDecimal!]!
  " Total supply of output token. Note that certain DEXes don't have an output token (e.g. Bancor) "
  outputTokenSupply: BigInt
  " Price per share of output token in USD "
  outputTokenPriceUSD: BigDecimal
  " Total supply of output tokens that are staked (usually in the MasterChef contract). Used to calculate reward APY. "
  stakedOutputTokenAmount: BigInt
  " Per-block reward token emission as of the current block normalized to a day (not hour), in token's native amount. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsAmount: [BigInt!]
  " Per-block reward token emission as of the current block normalized to a day (not hour), in USD value. This should be ideally calculated as the theoretical rate instead of the realized amount. "
  rewardTokenEmissionsUSD: [BigDecimal!]
}

type Protocol {
  " Smart contract address of the protocol's main contract (Factory, Registry, etc) "
  id: ID!
  " Name of the protocol, including version. e.g. Uniswap v3 "
  name: String!
  " Slug of protocol, including version. e.g. uniswap-v3 "
  slug: String!
  " Version of the subgraph schema, in SemVer format (e.g. 1.0.0) "
  schemaVersion: String!
  " Version of the subgraph implementation, in SemVer format (e.g. 1.0.0) "
  subgraphVersion: String!
  " Version of the methodology used to compute metrics, loosely based on SemVer format (e.g. 1.0.0) "
  methodologyVersion: String!
  " The blockchain network this subgraph is indexing on "
  network: Network!
  " The type of protocol (e.g. DEX, Lending, Yield, etc) "
  type: ProtocolType!
  " Current TVL (Total Value Locked) of the entire protocol "
  totalValueLockedUSD: BigDecimal!
  " Current PCV (Protocol Controlled Value). Only relevant for protocols with PCV. "
  protocolControlledValueUSD: BigDecimal
  " Revenue claimed by suppliers to the protocol. LPs on DEXs (e.g. 0.25% of the swap fee in Sushiswap). Depositors on Lending Protocols. NFT sellers on OpenSea. "
  cumulativeSupplySideRevenueUSD: BigDecimal!
  " Gross revenue for the protocol (revenue claimed by protocol). Examples: AMM protocol fee (Sushi’s 0.05%). OpenSea 10% sell fee. "
  cumulativeProtocolSideRevenueUSD: BigDecimal!
  " All revenue generated by the protocol. e.g. 0.30% of swap fee in Sushiswap, all yield generated by Yearn. "
  cumulativeTotalRevenueUSD: BigDecimal!
  " Number of cumulative unique users "
  cumulativeUniqueUsers: Int!
  " Total number of pools "
  totalPoolCount: Int!
  " Daily usage metrics for this protocol "
  dailyUsageMetrics: [UsageMetricsDailySnapshot!]!
  " Hourly usage metrics for this protocol "
  hourlyUsageMetrics: [UsageMetricsHourlySnapshot!]!
  " Daily financial metrics for this protocol "
  financialMetrics: [FinancialsDailySnapshot!]!
  " All pools that belong to this protocol "
  pools: [Pool!]!
}

type RewardToken {
  " { Reward token type }-{ Smart contract address of the reward token } "
  id: ID!
  " Reference to the actual token "
  token: Token!
  " The type of the reward token "
  type: RewardTokenType!
}

type Token {
  " Smart contract address of the token "
  id: ID!
  " Name of the token, mirrored from the smart contract "
  name: String!
  " Symbol of the token, mirrored from the smart contract "
  symbol: String!
  " The number of decimal places this token uses, default to 18 "
  decimals: Int!
  " Optional field to track the price of a token, mostly for caching purposes "
  lastPriceUSD: BigDecimal
  " Optional field to track the block number of the last token price "
  lastPriceBlockNumber: BigInt
}

type UsageMetricsDailySnapshot {
  " ID is # of days since Unix epoch time "
  id: ID!
  " Protocol this snapshot is associated with "
  protocol: Protocol!
  " Number of unique daily active users "
  dailyActiveUsers: Int!
  " Number of cumulative unique users "
  cumulativeUniqueUsers: Int!
  " Total number of transactions occurred in a day. Transactions include all entities that implement the Event interface. "
  dailyTransactionCount: Int!
  " Total number of pools "
  totalPoolCount: Int!
  " Block number of this snapshot "
  blockNumber: BigInt!
  " Timestamp of this snapshot "
  timestamp: BigInt!
}

type UsageMetricsHourlySnapshot {
  " { # of hours since Unix epoch time } "
  id: ID!
  " Protocol this snapshot is associated with "
  protocol: Protocol!
  " Number of unique hourly active users "
  hourlyActiveUsers: Int!
  " Number of cumulative unique users "
  cumulativeUniqueUsers: Int!
  " Total number of transactions occurred in an hour. Transactions include all entities that implement the Event interface. "
  hourlyTransactionCount: Int!
  " Block number of this snapshot "
  blockNumber: BigInt!
  " Timestamp of this snapshot "
  timestamp: BigInt!
}
