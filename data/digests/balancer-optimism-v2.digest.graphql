  totalBalanceUSD: BigDecimal!
  totalBalanceNotional: BigDecimal!
  totalVolumeUSD: BigDecimal!
  totalVolumeNotional: BigDecimal!
  totalSwapCount: BigInt!
}

type TradePair {
  "Token Address - Token Address"
  id: ID!
  token0: Token!
  token1: Token!
