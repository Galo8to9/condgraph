# Condensed subgraph schema.
# Filters and ordering follow standard subgraph conventions and are omitted here:
#   where: { <field>: value, <field>_gt: value, <field>_lt: value,
#            <field>_gte: value, <field>_lte: value, <field>_in: [values],
#            <field>_not: value, <field>_contains: substring, ... }
#   orderBy: <any field on the entity>
#   orderDirection: asc | desc
#   first: <n>   skip: <n>   block: { number: <n> }
# Apply these to any list query on the entities below.


scalar BigDecimal
scalar BigInt
scalar Bytes

enum Aggregation_current {
  exclude
  include
}

enum Aggregation_interval {
  hour
  day
}

enum LogLevel {
  CRITICAL
  ERROR
  WARNING
  INFO
  DEBUG
}

enum PoolType {
  Weighted
  Stable
  QuantAMMWeighted
  StableSurge
  Gyro2
  GyroE
  LBP
  FixedLBP
  ReClamm
}

"A log entry emitted by a subgraph during indexing.
Logs can be generated by the subgraph's AssemblyScript code using the `log.*` functions."
type _Log_ {
  "Unique identifier for this log entry"
  id: String!
  "The deployment hash of the subgraph that emitted this log"
  subgraphId: String!
  "The timestamp when the log was emitted, in RFC3339 format (e.g., '2024-01-15T10:30:00Z')"
  timestamp: String!
  "The severity level of the log entry"
  level: LogLevel!
  "The log message text"
  text: String!
  "Additional structured data passed to the log function as key-value pairs"
  arguments: [_LogArgument_!]!
  "Metadata about the source location in the subgraph code where the log was emitted"
  meta: _LogMeta_!
}

"A key-value pair of additional data associated with a log entry.
These correspond to arguments passed to the log function in the subgraph code."
type _LogArgument_ {
  "The parameter name"
  key: String!
  "The parameter value, serialized as a string"
  value: String!
}

"Source code location metadata for a log entry.
Indicates where in the subgraph's AssemblyScript code the log statement was executed."
type _LogMeta_ {
  "The module or file path where the log was emitted"
  module: String!
  "The line number in the source file"
  line: Int!
  "The column number in the source file"
  column: Int!
}

type Factory {
  "Unique identifier for the Factory"
  id: Bytes!
  "Address of the Factory contract"
  address: Bytes!
  "Type of pools this Factory creates"
  type: PoolType!
  "Version number of the Factory"
  version: Int!
  "Pools created by this Factory"
  pools: [Pool!]
}

type FixedLBPParams {
  "Unique identifier for the FixedLBPParams"
  id: Bytes!
  "Owner of the Fixed Price LBP"
  owner: Bytes!
  "Project token for the Fixed Price LBP"
  projectToken: Bytes!
  "Reserve token for the Fixed Price LBP"
  reserveToken: Bytes!
  "Start time of the Fixed Price LBP"
  startTime: BigInt!
  "End time of the Fixed Price LBP"
  endTime: BigInt!
  "Project token swap in blocked"
  isProjectTokenSwapInBlocked: Boolean!
  "Project token rate (fixed price)"
  projectTokenRate: BigInt!
}

type Gyro2Params {
  "Unique identifier for the Gyro2Params"
  id: Bytes!
  sqrtAlpha: BigDecimal!
  sqrtBeta: BigDecimal!
}

type GyroEParams {
  "Unique identifier for the GyroEParams"
  id: Bytes!
  alpha: BigDecimal!
  beta: BigDecimal!
  c: BigDecimal!
  s: BigDecimal!
  lambda: BigDecimal!
  tauAlphaX: BigDecimal!
  tauAlphaY: BigDecimal!
  tauBetaX: BigDecimal!
  tauBetaY: BigDecimal!
  u: BigDecimal!
  v: BigDecimal!
  w: BigDecimal!
  z: BigDecimal!
  dSq: BigDecimal!
}

type LBPParams {
  "Unique identifier for the LBPParams"
  id: Bytes!
  "Owner of the LBP"
  owner: Bytes!
  "Project token for the LBP"
  projectToken: Bytes!
  "Reserve token for the LBP"
  reserveToken: Bytes!
  "Initial weight of the project token"
  projectTokenStartWeight: BigInt!
  "Initial weight of the reserve token"
  reserveTokenStartWeight: BigInt!
  "Final weight of the project token"
  projectTokenEndWeight: BigInt!
  "Final weight of the reserve token"
  reserveTokenEndWeight: BigInt!
  "Start time of the LBP"
  startTime: BigInt!
  "End time of the LBP"
  endTime: BigInt!
  "Project token swap in blocked"
  isProjectTokenSwapInBlocked: Boolean!
  "The virtual token balance for the reserve token, indicating a seedless LBP if >0"
  reserveTokenVirtualBalance: BigInt!
}

type Pool {
  "Unique identifier for the Pool"
  id: Bytes!
  "Address of the Pool contract"
  address: Bytes!
  "Factory that created this Pool"
  factory: Factory!
  "Parameters for Weighted pools (null for other pool types)"
  weightedParams: WeightedParams
  "Parameters for Stable pools (null for other pool types)"
  stableParams: StableParams
  "Parameters for StableSurge pools (null for other pool types)"
  stableSurgeParams: StableSurgeParams
  "Parameters for Gyro2 pools (null for other pool types)"
  gyro2Params: Gyro2Params
  "Parameters for GyroE pools (null for other pool types)"
  gyroEParams: GyroEParams
  "Parameters for QuantAMMWeighted pools (null for other pool types)"
  quantAMMWeightedParams: QuantAMMWeightedParams
  "Parameters for LBP pools (null for other pool types)"
  lbpParams: LBPParams
  "Parameters for Fixed Price LBP pools (null for other pool types)"
  fixedLBPParams: FixedLBPParams
  "Parameters for ReClamm pools (null for other pool types)"
  reClammParams: ReClammParams
}

type QuantAMMWeightedDetail {
  id: Bytes!
  category: String!
  name: String!
  type: String!
  value: String!
  pool: QuantAMMWeightedParams!
}

type QuantAMMWeightedParams {
  "Unique identifier for the QuantAMMWeightedParams"
  id: Bytes!
  "Oracle staleness threshold"
  oracleStalenessThreshold: BigInt!
  "Pool registry"
  poolRegistry: BigInt!
  "Lambda values"
  lambda: [BigInt!]!
  "Maximum epsilon value"
  epsilonMax: BigInt!
  "Absolute weight guard rail"
  absoluteWeightGuardRail: BigInt!
  "Maximum trade size ratio"
  maxTradeSizeRatio: BigInt!
  "Update interval"
  updateInterval: BigInt!
  "Weights at the last update interval"
  weightsAtLastUpdateInterval: [BigInt!]!
  "Weight block multipliers"
  weightBlockMultipliers: [BigInt!]!
  "Last update interval time"
  lastUpdateIntervalTime: BigInt!
  "Last interpolation time possible"
  lastInterpolationTimePossible: BigInt!
  "address of UpdateWeightRunner for this pool (pool.updateWeightRunner())"
  runner: Bytes!
  "address of the active rule (UpdateWeightRunner.getPoolRule(pool))"
  rule: Bytes!
  "#int256[] from rule.getIntermediateGradientState(pool, numberOfAssets)"
  gradientIntermediates: [BigInt!]
  "#int256[] from rule.getMovingAverages(pool, numberOfAssets)"
  movingAverageIntermediates: [BigInt!]
  "Pool details array"
  details: [QuantAMMWeightedDetail!]!
}

type ReClammParams {
  "Unique identifier for the ReClammParams"
  id: Bytes!
  "The timestamp of the last user interaction"
  lastTimestamp: BigInt!
  "The last virtual balances of the pool"
  lastVirtualBalances: [BigInt!]!
  "Represents how fast the pool can move the virtual balances per day"
  dailyPriceShiftExponent: BigInt!
  "Internal time constant used to update virtual balances (1 - tau)"
  dailyPriceShiftBase: BigInt!
  "The centeredness margin of the pool"
  centerednessMargin: BigInt!
  "The current fourth root price ratio, an interpolation of the price ratio state"
  currentFourthRootPriceRatio: BigInt!
  "The fourth root price ratio at the start of an update"
  startFourthRootPriceRatio: BigInt!
  "The fourth root price ratio at the end of an update"
  endFourthRootPriceRatio: BigInt!
  "The timestamp when the update begins"
  priceRatioUpdateStartTime: BigInt!
  "The timestamp when the update ends"
  priceRatioUpdateEndTime: BigInt!
}

type StableParams {
  "Unique identifier for the StablePoolParams"
  id: Bytes!
  "Amplification parameter for Stable Pools"
  amp: BigInt!
}

type StableSurgeParams {
  "Unique identifier for the StableSurgeParams"
  id: Bytes!
  "Amplification parameter"
  amp: BigInt!
  "Maximum surge fee percentage"
  maxSurgeFeePercentage: BigDecimal!
  "Surge threshold percentage"
  surgeThresholdPercentage: BigDecimal!
}

type WeightedParams {
  "Unique identifier for the WeightedPoolParams"
  id: Bytes!
  "Token weights for Weighted Pools"
  weights: [BigDecimal!]!
}
