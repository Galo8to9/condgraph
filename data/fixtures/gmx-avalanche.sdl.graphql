type LiquidityPool {
  """ Smart contract address of the pool """
  id: Bytes!

  """ The protocol this pool belongs to """
  protocol: DerivPerpProtocol!

  """ Name of liquidity pool (e.g. Curve.fi DAI/USDC/USDT) """
  name: String

  """ Symbol of liquidity pool (e.g. 3CRV) """
  symbol: String

  """ Tokens that need to be deposited to take a position in protocol. e.g. WETH and USDC to deposit into the WETH-USDC pool. Array to account for multi-asset pools like Curve and Balancer 
  """
  inputTokens(skip: Int = 0, first: Int = 100, orderBy: Token_orderBy, orderDirection: OrderDirection, where: Token_filter): [Token!]!

  """ Token that is minted to track ownership of position in protocol """
  outputToken: Token

  """ Additional tokens that are given as reward for position in a protocol, usually in liquidity mining programs. e.g. SUSHI in the Onsen program, MATIC for Aave Polygon, usually in liquidity mining programs. e.g. SUSHI in the Onsen program, MATIC for Aave Polygon 
  """
  rewardTokens(skip: Int = 0, first: Int = 100, orderBy: RewardToken_orderBy, orderDirection: OrderDirection, where: RewardToken_filter): [RewardToken!]

  """ Fees per trade incurred to the user. Should include all fees that apply to a pool (e.g. Curve has a trading fee AND an admin fee, which is a portion of the trading fee. Uniswap only has a trading fee and no protocol fee. ) 
  """
  fees(skip: Int = 0, first: Int = 100, orderBy: LiquidityPoolFee_orderBy, orderDirection: OrderDirection, where: LiquidityPoolFee_filter): [LiquidityPoolFee!]!

  """ Name of oracle source (e.g. chainlink, uniswap, pyth) """
  oracle: String

  """ Creation timestamp """
  createdTimestamp: BigInt!

  """ Creation block number """
  createdBlockNumber: BigInt!

  """ Current TVL (Total Value Locked) of this pool in USD """
  totalValueLockedUSD: BigDecimal!

  """ All funding rates for this liquidity pool. (Should be in APR format and the same order as inputTokens) 
  """
  fundingrate: [BigDecimal!]!

  """ All revenue generated by the liquidity pool, accrued to the supply side. 
  """
  cumulativeSupplySideRevenueUSD: BigDecimal!

  """ All revenue generated by the liquidity pool, accrued to the protocol. 
  """
  cumulativeProtocolSideRevenueUSD: BigDecimal!

