type RewardToken {
  """ Bytes.fromI32(0|1).concat(rewardTokenAddress), where 0 is for deposit and 1 is for borrow 
  """
  id: Bytes!

  """ Reference to the actual token """
  token: Token!

  """ The type of the reward token """
  type: RewardTokenType!
}

