  """Version number of the Factory"""
  version: Int!

  """Pools created by this Factory"""
  pools(skip: Int = 0, first: Int = 100, orderBy: Pool_orderBy, orderDirection: OrderDirection, where: Pool_filter): [Pool!]
}

