  """
  withdrawBaseInteractions(skip: Int = 0, first: Int = 100, orderBy: WithdrawBaseInteraction_orderBy, orderDirection: OrderDirection, where: WithdrawBaseInteraction_filter): [WithdrawBaseInteraction!]!

  """All interactions where a position was liquidated in this market"""
  absorbDebtInteractions(skip: Int = 0, first: Int = 100, orderBy: AbsorbDebtInteraction_orderBy, orderDirection: OrderDirection, where: AbsorbDebtInteraction_filter): [AbsorbDebtInteraction!]!

  """All interactions where a collateral asset was supplied to this market"""
  supplyCollateralInteractions(skip: Int = 0, first: Int = 100, orderBy: SupplyCollateralInteraction_orderBy, orderDirection: OrderDirection, where: SupplyCollateralInteraction_filter): [SupplyCollateralInteraction!]!

  """
  All interactions where a collateral asset was withdrawn from this market
  """
  withdrawCollateralInteractions(skip: Int = 0, first: Int = 100, orderBy: WithdrawCollateralInteraction_orderBy, orderDirection: OrderDirection, where: WithdrawCollateralInteraction_filter): [WithdrawCollateralInteraction!]!

  """
  All interactions where a collateral asset was transferred in this market
  """
  transferCollateralInteractions(skip: Int = 0, first: Int = 100, orderBy: TransferCollateralInteraction_orderBy, orderDirection: OrderDirection, where: TransferCollateralInteraction_filter): [TransferCollateralInteraction!]!

  """
  All interactions where a collateral asset was absorbed by the market during a liquidation
  """
  absorbCollateralInteractions(skip: Int = 0, first: Int = 100, orderBy: AbsorbCollateralInteraction_orderBy, orderDirection: OrderDirection, where: AbsorbCollateralInteraction_filter): [AbsorbCollateralInteraction!]!

