  hourlyUsage(skip: Int = 0, first: Int = 100, orderBy: MarketHourlyUsage_orderBy, orderDirection: OrderDirection, where: MarketHourlyUsage_filter): [MarketHourlyUsage!]!

  """Historical snapshots of daily market usage"""
  dailyUsage(skip: Int = 0, first: Int = 100, orderBy: MarketDailyUsage_orderBy, orderDirection: OrderDirection, where: MarketDailyUsage_filter): [MarketDailyUsage!]!

