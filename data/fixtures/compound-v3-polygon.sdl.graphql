  withdrawReservesInteractions(skip: Int = 0, first: Int = 100, orderBy: WithdrawReservesInteraction_orderBy, orderDirection: OrderDirection, where: WithdrawReservesInteraction_filter): [WithdrawReservesInteraction!]!

