  All interactions where a collateral asset was bought using base assets in this market
  """
  buyCollateralInteractions(skip: Int = 0, first: Int = 100, orderBy: BuyCollateralInteraction_orderBy, orderDirection: OrderDirection, where: BuyCollateralInteraction_filter): [BuyCollateralInteraction!]!

