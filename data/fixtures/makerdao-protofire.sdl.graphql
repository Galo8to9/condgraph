""" Vault owner """
type User {
  """ Equals to account address """
  id: ID!

  """ Account address """
  address: Bytes!

  """ User's DAI in the Vault"""
  totalVaultDai: BigDecimal!

  """ User's Total Erc20.DAI """
  totalDaiBalance: BigDecimal!

  """ The user savings in DAI (Pot#pie) """
  savings: BigDecimal!

  """ Total maker balance """
  totalMkrBalance: BigDecimal!

  """ Number of user proxies associated to the user """
  proxyCount: BigInt!

  """ Number of vaults opened by the user """
  vaultCount: BigInt!

  """ User proxies. Up to one per collateral type """
  proxies(skip: Int = 0, first: Int = 100, orderBy: UserProxy_orderBy, orderDirection: OrderDirection, where: UserProxy_filter): [UserProxy!]

  """ User's vaults """
  vaults(skip: Int = 0, first: Int = 100, orderBy: Vault_orderBy, orderDirection: OrderDirection, where: Vault_filter): [Vault!]

  """ User's collaterals """
  collaterals(skip: Int = 0, first: Int = 100, orderBy: Collateral_orderBy, orderDirection: OrderDirection, where: Collateral_filter): [Collateral!]

  """ User's Outgoing Transfers for DAI """
  daiOutgoingTransfers(skip: Int = 0, first: Int = 100, orderBy: DaiTransfer_orderBy, orderDirection: OrderDirection, where: DaiTransfer_filter): [DaiTransfer!]

  """ User's Incoming Transfers for DAI """
  daiIncomingTransfers(skip: Int = 0, first: Int = 100, orderBy: DaiTransfer_orderBy, orderDirection: OrderDirection, where: DaiTransfer_filter): [DaiTransfer!]

  """ User's dai approvals """
  daiApprovals(skip: Int = 0, first: Int = 100, orderBy: DaiApproval_orderBy, orderDirection: OrderDirection, where: DaiApproval_filter): [DaiApproval!]

  """ User's mkr outgoing transfers """
  mkrOutgoingTransfers(skip: Int = 0, first: Int = 100, orderBy: MkrTransfer_orderBy, orderDirection: OrderDirection, where: MkrTransfer_filter): [MkrTransfer!]

  """ User's mkr incoming transfers """
  mkrIncomingTransfers(skip: Int = 0, first: Int = 100, orderBy: MkrTransfer_orderBy, orderDirection: OrderDirection, where: MkrTransfer_filter): [MkrTransfer!]

  """ User's mkr approvals """
  mkrApprovals(skip: Int = 0, first: Int = 100, orderBy: MkrApproval_orderBy, orderDirection: OrderDirection, where: MkrApproval_filter): [MkrApproval!]
}

""" Contract used to execute transactions and sequences of transactions on behalf of a user 
"""
